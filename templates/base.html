<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VanityTweaks - FPS Boost & Delay Optimizer{% endblock %}</title>
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- PRELOADER / OPENING INTRO ANIMATION -->
    <div id="preloader">
        <div class="preloader-logo-wrapper">
            <div class="preloader-ring"></div>
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="VanityTweaks Logo" class="preloader-logo">
        </div>
        <h5 class="fw-bold text-white mt-4 mb-1 tracking-wider" style="letter-spacing: 2px;">VANITY<span class="text-accent">TWEAKS</span></h5>
        <p class="text-secondary small">Performans Yükleniyor...</p>
    </div>

    {% block body %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Opening animation preloader script
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                setTimeout(function() {
                    preloader.classList.add('fade-out');
                }, 400);
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
