<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VanityTweaks - FPS Boost & Latency Optimizer{% endblock %}</title>
    <!-- Favicon / Tab Logo -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- MOUSE FOLLOWER PURPLE GLOW -->
    <div id="cursor-glow" class="cursor-glow"></div>

    <!-- PRELOADER / OPENING INTRO ANIMATION -->
    <div id="preloader">
        <div class="preloader-logo-wrapper">
            <div class="preloader-ring"></div>
            <div class="preloader-ring-outer"></div>
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="VanityTweaks Logo" class="preloader-logo">
        </div>
        <h5 class="fw-bold text-white mt-4 mb-1 tracking-wider glowing-title" style="letter-spacing: 3px;">VANITY<span class="text-accent">TWEAKS</span></h5>
        <p class="text-secondary small shimmer-text">Loading Performance Systems...</p>
    </div>

    {% block body %}{% endblock %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Opening preloader animation script
        window.addEventListener('load', function() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                setTimeout(function() {
                    preloader.classList.add('fade-out');
                    document.body.classList.add('loaded');
                }, 500);
            }
        });

        // Mouse Follower Purple Light Script
        document.addEventListener('DOMContentLoaded', function() {
            const cursorGlow = document.getElementById('cursor-glow');
            if (cursorGlow && window.matchMedia('(pointer: fine)').matches) {
                let mouseX = window.innerWidth / 2;
                let mouseY = window.innerHeight / 2;
                let glowX = mouseX;
                let glowY = mouseY;

                window.addEventListener('mousemove', function(e) {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                });

                function renderGlow() {
                    glowX += (mouseX - glowX) * 0.1;
                    glowY += (mouseY - glowY) * 0.1;
                    cursorGlow.style.transform = `translate3d(${glowX}px, ${glowY}px, 0)`;
                    requestAnimationFrame(renderGlow);
                }
                renderGlow();
            }

            // Scroll Reveal Animations & Smooth Navigation
            const observerOptions = {
                threshold: 0.15,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reveal-on-scroll').forEach((el) => observer.observe(el));

            // Smooth Scroll for Navigation Anchors
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const targetId = this.getAttribute('href');
                    if (targetId === '#') return;
                    
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        e.preventDefault();
                        const headerOffset = 85;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });

                        // Auto-close mobile navbar if open
                        const navbarCollapse = document.getElementById('navbarNav');
                        if (navbarCollapse && navbarCollapse.classList.contains('show')) {
                            const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
                            if (bsCollapse) bsCollapse.hide();
                        }
                    }
                });
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
